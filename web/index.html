<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X audience screenshot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <p id="status" class="lead" role="status" aria-live="polite">Waiting for your capture. Press Capture, or use the extension icon.</p>

    <h1>Screenshot</h1>

    <div class="banner">
      <div class="banner-text">
        <strong>Open your X audience page</strong>
        <span>Only you can see it — the extension captures the whole tab.</span>
      </div>
      <a class="open-link" href="https://x.com/i/account_analytics/audience" target="_blank" rel="noopener">
        open
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
        </svg>
      </a>
    </div>

    <button id="placeholder" type="button" class="placeholder">
      <svg class="placeholder-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="M21 16l-5-5-8 8"/>
      </svg>
      <span class="placeholder-title">Capture your screenshot</span>
      <span class="placeholder-hint">click here, or use the extension icon</span>
    </button>

    <figure id="preview" hidden>
      <div class="frame"><img id="shot" alt="Screenshot of your X audience page"></div>
      <figcaption><span id="meta"></span><button id="recapture" type="button" class="link">Recapture</button></figcaption>
    </figure>
  </main>
  <script src="helpers.js"></script>
  <script src="app.js"></script>
</body>
</html>
